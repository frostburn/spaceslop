<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080b14">
    <title>Spaceslop</title>
  </head>
  <body>
    <main>
      <div class="console">
        <header class="hud" aria-label="Flight status">
          <div><span id="sector">SECTOR 01</span><strong id="score">000000</strong></div>
          <div><span>HULL</span><strong id="hull">04</strong></div>
          <button id="pause" type="button" hidden>Pause</button>
        </header>
        <aside class="pilot-console" aria-label="Pilot">
          <figure>
            <div id="selected-portrait"></div>
            <figcaption id="selected-pilot"></figcaption>
          </figure>
          <div id="desktop-picker"></div>
        </aside>
        <footer class="controls">
          <span id="status" role="status">Tap for drone · Drag to steer</span>
          <button id="pulse" type="button" disabled>Pulse <b id="charges">02</b></button>
        </footer>
      </div>
      <div class="bay">
        <div id="flight">
          <canvas id="field" aria-label="Spaceslop flight view"></canvas>
          <div id="boss-hud" hidden><span>INTERCEPTOR</span><progress id="boss-health" aria-label="Boss health"></progress></div>
          <section id="panel" aria-labelledby="heading">
            <h1 id="heading">Spaceslop</h1>
            <p id="message">Tap to send the drone. Drag to steer. Both guns fire automatically.</p>
            <div id="mobile-picker">
              <fieldset id="pilot-picker">
                <legend>Select pilot</legend>
                <div id="pilot-choices"></div>
              </fieldset>
            </div>
            <button id="start" type="button">Launch</button>
            <small>Keyboard · WASD or arrows · Space for pulse</small>
            <button id="update" type="button" hidden>Apply update</button>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
