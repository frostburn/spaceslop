<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080b14">
    <title>Spaceslop</title>
  </head>
  <body>
    <main>
      <div class="console">
        <header class="hud" aria-label="Flight status">
          <div><span id="sector">SECTOR 01</span><strong id="score">000000</strong></div>
          <div><span>HULL</span><strong id="hull">04</strong></div>
          <button id="pause" type="button" hidden>Pause</button>
        </header>
        <aside class="pilot-console" aria-label="Pilot">
          <figure>
            <div id="selected-portrait"></div>
            <figcaption>
              <strong id="selected-pilot"></strong>
              <span id="pilot-perk-readout" hidden></span>
            </figcaption>
          </figure>
          <div id="desktop-picker"></div>
        </aside>
        <footer class="controls">
          <span id="status" role="status">Tap for drone · Drag to steer</span>
          <button id="pulse" type="button" disabled>Pulse <b id="charges">02</b></button>
        </footer>
      </div>
      <div class="bay">
        <div id="flight">
          <canvas id="field" aria-label="Spaceslop flight view"></canvas>
          <div id="boss-hud" hidden><span id="boss-name">INTERCEPTOR</span><progress id="boss-health" aria-label="Boss health"></progress></div>
          <section id="panel" aria-labelledby="heading">
            <h1 id="heading">Spaceslop</h1>
            <p id="message">Tap to place the drone. Drag to steer.</p>
            <div id="mobile-picker">
              <div id="loadout-picker">
                <label class="loadout-field">
                  Level
                  <select id="level">
                    <option value="io">Io · Caldera slice</option>
                    <option value="titan">Titan · Research station</option>
                    <option value="ice">Frostwake · Ice field</option>
                    <option value="broodlock">Broodlock · Ant hive</option>
                    <option value="preserve">Overgrown preserve</option>
                  </select>
                </label>
                <fieldset id="pilot-picker">
                  <legend>Select pilot</legend>
                  <div id="pilot-choices"></div>
                </fieldset>
                <p id="pilot-perk-description"></p>
                <label class="loadout-field">
                  Drone weapon
                  <select id="drone-weapon">
                    <option value="sentry">Sentry</option>
                    <option value="towline">Towline</option>
                  </select>
                </label>
                <details id="test-wing-loadout" class="test-wings" hidden>
                  <summary>Test wing loadout</summary>
                  <label class="loadout-field">Left wing <select id="left-wing"></select></label>
                  <label class="loadout-field">Right wing <select id="right-wing"></select></label>
                </details>
              </div>
            </div>
            <button id="start" type="button" disabled>Launch</button>
            <small>Keyboard · WASD or arrows · Space for pulse</small>
            <button id="update" type="button" hidden>Apply update</button>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
